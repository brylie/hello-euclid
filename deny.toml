[advisories]
# The lint level for crates which do not have a detectable license
unlicensed = "deny"
# Lint level for when security vulnerabilities are found
vulnerable = "deny"
# A list of advisory IDs to ignore. Note that ignored advisories will still
# output a note when they are encountered.
ignore = [
    # "RUSTSEC-2020-0001",
]

[licenses]
# Lint level for licenses considered copyleft
copyleft = "warn"
# Blanket approval or denial for OSI-approved or FSF Free/Libre licenses
allow-osi-fsf-free = "both"
# Lint level used when no other predicates are matched
default = "deny"
# The confidence threshold for detecting a license from license text.
confidence-threshold = 0.8
# Some clearly defined allow-lists and deny-lists built-in to cargo-deny
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
deny = [
    # Each entry the name of a license (in the case of SPDX identifiers) or
    # the name of the license file the crate claims to use in the crate or as
    # a well-known abbreviation of a particular license
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level used when a crate marked as 'deny' is detected
denied = [
    # Each entry can reference a crate by the name the crate provides, and an optional
    # version range. If no version range is specified, then all versions will be considered
    # when denying a crate.
    #
    # However, a value of "*" can be used to specify an everlasting range that is only
    # useful in the deny case
    # { name = "ansi_term", version = "*" },
]
# Certain crates/versions that will be skipped when doing duplicate detection.
skip = [
    # { name = "ansi_term", version = "0.11.0" },
]
# Similarly named crates that are allowed to coexist
skip-tree = [
    # { name = "windows-sys", version = "0.42.0" },
]

[sources]
# Lint level for what to happen when a crate from a crate registry that is not in the allow list
# is detected; a crate is a crate from a crate registry if it is not in a workspace member
# and depends on the crates.io index to find parent and dependency crates
unknown-registry = "warn"
# Lint level for what to happen when a crate from a git repository that is not in the allow list
# is detected; if not set, then the value of unknown-registry is used instead
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/robbert-vdh/nih-plug.git",
    "https://github.com/RustAudio/baseview.git",
    "https://github.com/BillyDM/egui-baseview.git",
    "https://github.com/robbert-vdh/vst3-sys.git",
    "https://codeberg.org/RustAudio/nice-plug.git",
]
