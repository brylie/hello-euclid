[package]
name = "hello_euclid"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "hello_euclid"
path = "src/standalone.rs"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
